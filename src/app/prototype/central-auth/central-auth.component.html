<main class="auth-page">
  <a class="brand" routerLink="/"><span>E</span>E‑Scolarité</a>
  <section class="auth-card">
    <div class="eyebrow">ACCÈS SÉCURISÉ</div>
    <h1>Connexion à votre espace</h1>
    <p>Sélectionnez votre établissement si vous y êtes rattaché, puis saisissez vos identifiants.</p>

    <form [formGroup]="connexion" (ngSubmit)="soumettre()">
      <label class="school-picker">Établissement
        <select formControlName="institut_id" (change)="choisirInstitut($any($event.target).value)">
          <option value=""></option>
          @for (institut of instituts(); track institut.id) { <option [value]="institut.id">{{ institut.nom }}</option> }
        </select>
      </label>
      <label>Adresse e-mail<input type="email" formControlName="email" autocomplete="email" placeholder="vous@daara.tech" /></label>
      <label>Mot de passe<input type="password" formControlName="password" autocomplete="current-password" placeholder="Votre mot de passe" /></label>
      @if (erreur()) { <p class="error">{{ erreur() }}</p> }
      <button type="submit" [disabled]="chargement()">{{ chargement() ? 'Connexion…' : 'Se connecter' }}</button>
    </form>
    <p class="help">Votre établissement n’est pas encore sur E‑Scolarité ? <a routerLink="/adhesion">Déposer une demande d’adhésion</a></p>
  </section>
</main>
